[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# "confidant" on PyPI is an unrelated project, so the distribution needs its own name; the
# package you import and the command you run are both still `confidant`.
name = "confidant-agent"
dynamic = ["version"]
description = "An AI agent that helps you think clearly about the people you date."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuchen Zhang" }]
keywords = ["ai", "agent", "anthropic", "claude", "dating", "relationships"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "anthropic>=0.40",
  # Already an anthropic dependency; listed because progress.py reads partial JSON with it.
  "jiter>=0.5",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# `confidant serve`. Optional, so the CLI alone stays four dependencies.
api = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
]
dev = [
  "confidant-agent[api]",
  # tests/test_packaging.py builds the wheel and sdist in-process with it.
  "hatchling>=1.21",
  # FastAPI's TestClient runs on it; the suite never opens a socket with it.
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
confidant = "confidant.cli:main"

[project.urls]
Homepage = "https://github.com/b-2018-ZhangYuchen/confidant"
Issues = "https://github.com/b-2018-ZhangYuchen/confidant/issues"

[tool.hatch.version]
path = "src/confidant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/confidant"]

[tool.hatch.build.targets.sdist]
# An allowlist, not the default of "everything git does not ignore": a working tree for
# this project is exactly where an untracked chat export or a stray document sits, and an
# sdist is published to the world.
only-include = [
  "src",
  "tests",
  "examples",
  "docs",
  "README.md",
  "ROADMAP.md",
  "CHANGELOG.md",
  "LICENSE",
  ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
