# Step 5 sweep (r4): the sft config for 150 iterations, saved every 50 for early stopping.
kind: sft
name: sweep-r4
prompt: compact
model: mlx-community/Qwen2.5-3B-Instruct-4bit
data: lab-cache/sft
fine_tune_type: lora
mask_prompt: true
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 150
learning_rate: 1.0e-4
max_seq_length: 3072
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 50
val_batches: 25
save_every: 50
seed: 0
adapter_path: lab-cache/adapters/sweep-r4
lora_parameters: {rank: 4, scale: 20.0, dropout: 0.0}
