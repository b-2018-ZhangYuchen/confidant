# Fine-tune from the continued-pre-training checkpoint: QLoRA on the train split (redacted compact prompt -> label JSON), prompt
# masked out of the loss, val split for validation loss. About 2 epochs.
kind: sft
name: cpt-sft
prompt: compact
model: lab-cache/models/qwen2.5-3b-cpt
data: lab-cache/sft
fine_tune_type: lora
mask_prompt: true
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 400
learning_rate: 1.0e-4
max_seq_length: 3072
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 50
val_batches: 25
save_every: 100
seed: 0
adapter_path: lab-cache/adapters/cpt-sft
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.0}
