# The scenario grid for the lab's labelled data. Entirely fictional.
#
# Each scenario is a seed: a setting, and the exact lines the match must say. A local
# model writes the rest of the conversation around them (`python -m confidant.lab
# generate`), several times per scenario with different names, lengths, and tones. The
# label comes from here, never from the generator: the planted lines are the evidence, and
# `category` and `severity` are what a careful read should file them as.
#
# kind = "flag"           planted lines a careful read should flag
# kind = "hard_negative"  planted lines that look like a flag and are not one
# kind = "clean"          no planted lines; an ordinary conversation
#
# Severity follows the tier definitions in confidant/prompts/flags.py. The danger
# categories (threat, coercion, sexual_pressure, isolation, monitoring) are always
# danger; analyze_flags enforces that floor whatever a model files them as.
#
# No line here may appear in examples/eval/ (the gold set); `python -m confidant.lab
# check` enforces it.

# -- threat ---------------------------------------------------------------------------

[[scenario]]
id = "threat-01"
kind = "flag"
category = "threat"
severity = "danger"
setting = "they have been on four dates; the owner says they want to slow things down"
planted = ["if you end this you'll regret it, I promise you that"]
behavior = "Answers the owner slowing things down with a warning that they will regret it."
why = "A promise of consequences for leaving is a threat, however it is worded."

[[scenario]]
id = "threat-02"
kind = "flag"
category = "threat"
severity = "danger"
setting = "the owner did not reply for a day because of work"
planted = ["nobody ignores me like that. I know where your office is"]
behavior = "Responds to a slow reply by pointing out they know where the owner works."
why = "Naming where someone can be found, in anger, is an implied threat."

[[scenario]]
id = "threat-03"
kind = "flag"
category = "threat"
severity = "danger"
setting = "the owner mentions having coffee with an ex to return some books"
planted = ["tell him if he texts you again I'll make sure he can't", "I'm not joking about this"]
behavior = "Threatens the owner's ex and insists they are serious."
why = "A threat against someone in the owner's life is still a threat, and a warning sign about the match."

[[scenario]]
id = "threat-04"
kind = "flag"
category = "threat"
severity = "danger"
setting = "the owner cancels a dinner because they feel unwell"
planted = ["you really don't want to see me angry. cancel on me again and see what happens"]
behavior = "Warns the owner about what happens if they cancel again."
why = "An open-ended 'see what happens' tied to anger is a threat."

[[scenario]]
id = "threat-05"
kind = "flag"
category = "threat"
severity = "danger"
setting = "the owner says the photos they sent earlier were private and asks the match to delete them"
planted = ["maybe I'll just send them to your sister and see how private they are"]
behavior = "Threatens to share private photos with the owner's family."
why = "Threatening to share intimate images is a serious threat and in many places a crime."

# -- coercion -------------------------------------------------------------------------

[[scenario]]
id = "coercion-01"
kind = "flag"
category = "coercion"
severity = "danger"
setting = "the owner says they cannot come over tonight"
planted = ["if you loved me you'd be here. get in a cab now or don't bother texting me again"]
behavior = "Makes the relationship conditional on the owner coming over immediately."
why = "An ultimatum that trades affection for compliance is coercion."

[[scenario]]
id = "coercion-02"
kind = "flag"
category = "coercion"
severity = "danger"
setting = "the owner wants to keep their own apartment for now"
planted = ["give me a key by friday or I'll assume you're hiding something", "I'm done being patient"]
behavior = "Demands a key by a deadline and treats refusal as proof of hiding something."
why = "Deadlines with a punishment attached are pressure to comply, not a request."

[[scenario]]
id = "coercion-03"
kind = "flag"
category = "coercion"
severity = "danger"
setting = "the owner says they would rather not hand over their phone passcode"
planted = ["either you show me your phone tonight or we're finished. your choice"]
behavior = "Gives an ultimatum to hand over the owner's phone."
why = "Forcing access with an ultimatum is coercive, whatever the reason given."

[[scenario]]
id = "coercion-04"
kind = "flag"
category = "coercion"
severity = "danger"
setting = "the owner plans to visit their parents for the weekend"
planted = ["you're not going. I already told you how this weekend is going to go", "don't make me ask twice"]
behavior = "Tells the owner they are not allowed to make their own weekend plans."
why = "Deciding where the owner may go, and implying consequences, is control by force of will."

[[scenario]]
id = "coercion-05"
kind = "flag"
category = "coercion"
severity = "danger"
setting = "the owner asks for a few days to think about moving in together"
planted = ["I already gave notice on my place, so you don't really get to say no now"]
behavior = "Presents a decision as already made to remove the owner's choice."
why = "Creating a fait accompli to force agreement is coercion."

