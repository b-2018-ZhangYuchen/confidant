planted = ["my crypto coach doubled my savings in a month. put in two thousand and I'll show you how"]
behavior = "Pushes an investment scheme on someone they have never met."
why = "Investment pitches from online matches who have not met are a common scam pattern."

[[scenario]]
id = "money-02"
kind = "flag"
category = "financial_pressure"
severity = "danger"
setting = "the match says they work abroad on an oil rig and have been chatting for a month"
planted = ["my account is frozen and I need 800 for customs today, I'll pay you back the moment I land"]
behavior = "Asks someone they have never met for urgent money with a repayment promise."
why = "An urgent request for money from a match met only online is a classic romance-scam sign."

[[scenario]]
id = "money-03"
kind = "flag"
category = "financial_pressure"
severity = "concern"
setting = "they have been on three dates and the match always forgets their wallet"
planted = ["can you get this one too? payday is next week, I swear", "you're better with money than me anyway"]
behavior = "Repeatedly asks the owner to pay, with flattery to smooth it over."
why = "A pattern of the owner always paying is worth noticing early."
innocent = "They may genuinely be short until payday and embarrassed about it."

[[scenario]]
