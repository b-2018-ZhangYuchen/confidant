[[scenario]]
id = "money-05"
kind = "flag"
category = "financial_pressure"
severity = "danger"
setting = "they matched last week; the match is very affectionate"
planted = ["buy me gift cards and send the codes, it's the only way I can get them here", "please, I have nobody else"]
behavior = "Asks for gift card codes and leans on having no one else to ask."
why = "Gift card codes are a scammer's favourite payment, because they cannot be traced or recovered."

