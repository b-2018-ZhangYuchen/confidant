name: Release

# Pushing a tag like v0.2.0 builds, checks, and publishes that version. Nothing here
# runs on an ordinary push; CI covers those.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" build

      - name: Check
        run: |
          ruff check .
          ruff format --check .
          pytest -q

      - name: Tag matches the package version
        run: |
          version=$(python -c "import confidant; print(confidant.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match confidant.__version__ ($version)."
            exit 1
          fi

      - name: Build
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Confidant $version" --notes-file notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI must list this repository, this workflow, and this
    # environment as a publisher for confidant-agent. No token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
